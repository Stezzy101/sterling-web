<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanks — Plainspoken</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      background:#f5f3ee;
      color:#1d1d1b;
      font-family:Arial,Helvetica,sans-serif;
    }

    .wrap{
      width:min(1180px,calc(100% - 48px));
      margin:auto;
    }

    header{
      border-bottom:1px solid #d8d4cc;
      padding:28px 0;
    }

    header a{
      color:inherit;
      text-decoration:none;
      font-size:22px;
      font-weight:700;
    }

    main{
      min-height:calc(100vh - 90px);
      display:flex;
      align-items:center;
      padding:70px 0;
    }

    .eyebrow{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.16em;
      color:#29473d;
      font-weight:700;
      margin-bottom:22px;
    }

    h1{
      margin:0;
      max-width:850px;
      font-size:clamp(62px,10vw,120px);
      line-height:.92;
      letter-spacing:-.06em;
    }

    p{
      max-width:620px;
      margin:30px 0 36px;
      font-size:20px;
      line-height:1.55;
      color:#5d5953;
    }

    .button{
      display:inline-flex;
      padding:14px 18px;
      border:1px solid #1d1d1b;
      color:#1d1d1b;
      text-decoration:none;
      font-weight:600;
    }

    .button:hover{
      background:#1d1d1b;
      color:#f5f3ee;
    }

    @media(max-width:600px){
      .wrap{
        width:min(100% - 32px,1180px);
      }

      header{
        padding:22px 0;
      }

      main{
        align-items:flex-start;
        padding-top:90px;
      }

      h1{
        font-size:58px;
      }

      p{
        font-size:18px;
      }

      .button{
        width:100%;
        justify-content:center;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="wrap">
    <a href="./index.html">Plainspoken</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="eyebrow">Enquiry received</div>

    <h1>Thanks.<br>We’ll take a look.</h1>

    <p>
      We’ve got your message. We’ll have a look at the business
      and get back to you as soon as we can.
    </p>

    <a class="button" href="./index.html">Back to Plainspoken</a>
  </div>
</main>

</body>
</html>
